# racecar-35 cloud receiver
#
# Behind nginx. nginx terminates TLS, proxies plain HTTP to this service on
# port 8089. For initial LAN testing the dash points directly at this port
# over plain HTTP and skips nginx entirely.
#
# Bring up:   docker compose up -d --build
# Logs:       docker compose logs -f
# Tear down:  docker compose down
services:
  cloud:
    build: .
    container_name: racecar35-cloud
    restart: unless-stopped
    ports:
      # Host:container. Defaults to host port 9000. Override via
      # RACECAR_HOST_PORT in .env (e.g. RACECAR_HOST_PORT=8089) — no rebuild
      # needed, just:
      #   docker compose up -d        (recreates the container with the new port)
      # The container always listens on 8089 internally.
      - "${RACECAR_HOST_PORT:-9000}:8089"
    environment:
      # If set, requests must send X-API-Key: <this value>. Leave empty during
      # initial bring-up so a fresh dash without credentials can still upload.
      RACECAR_API_KEY: "${RACECAR_API_KEY:-}"
      RACECAR_DATA_DIR: "/data"
      RACECAR_SERVICE_NAME: "racecar-35 cloud"
      # Google OAuth for the browser UI. Leave GOOGLE_CLIENT_ID/SECRET blank
      # for open dev mode. Dash uploads still authenticate with X-API-Key.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      RACECAR_SESSION_SECRET: "${RACECAR_SESSION_SECRET:-}"
      RACECAR_ALLOWED_EMAILS: "${RACECAR_ALLOWED_EMAILS:-}"
      # Bootstrap admin(s) for the /admin portal. Always allowed + always admin.
      RACECAR_ADMIN_EMAILS: "${RACECAR_ADMIN_EMAILS:-}"
      RACECAR_COOKIE_SECURE: "${RACECAR_COOKIE_SECURE:-0}"
      RACECAR_SESSION_TTL_SECONDS: "${RACECAR_SESSION_TTL_SECONDS:-604800}"
      # Reject any body larger than this many bytes. 64 MB is generous for an
      # hour of 25 Hz NDJSON. Increase if you record longer sessions.
      RACECAR_MAX_BODY_BYTES: "67108864"
    volumes:
      # Persistent on-disk storage for uploaded sessions. Survives container
      # rebuilds. Map to wherever you keep server data on the host.
      - ./data:/data
    networks:
      # nginx (bluecloud-proxy) reaches this container by name on proxy_default.
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; \
              sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # The /docker/proxy/ nginx (bluecloud-proxy) lives on `proxy_default`.
  # Joining it lets nginx proxy_pass to http://racecar35-cloud:8089 by name.
  proxy:
    external: true
    name: proxy_default
