# racecar-35 cloud — PRODUCTION stack (app only).
#
# The app listens on the host port (default 9000) and is fronted by an
# EXTERNAL reverse proxy (e.g. nginx) that terminates TLS for RACECAR_DOMAIN
# and proxies to http://<host>:<port>.
#
# Prereqs on the server:
#   1. Docker + the compose plugin installed.
#   2. DNS: RACECAR_DOMAIN -> the reverse proxy's public IP.
#   3. The external proxy forwards RACECAR_DOMAIN -> http://<this-host>:<RACECAR_HOST_PORT>.
#   4. cp .env.example .env  and fill in secrets (+ RACECAR_HOST_PORT if not 9000).
#
# Bring up:   docker compose -f docker-compose.prod.yml up -d --build
# Logs:       docker compose -f docker-compose.prod.yml logs -f
# Tear down:  docker compose -f docker-compose.prod.yml down
services:
  cloud:
    build: .
    container_name: racecar35-cloud
    restart: unless-stopped
    # Publish a stable HOST port (default 9000, override with RACECAR_HOST_PORT
    # in .env) so the external reverse proxy can point at host:<port> instead of
    # chasing the container's internal IP (which changes on every recreate ->
    # 502 "Host is unreachable").
    ports:
      - "${RACECAR_HOST_PORT:-9000}:8089"
    environment:
      RACECAR_API_KEY: "${RACECAR_API_KEY:-}"
      RACECAR_DATA_DIR: "/data"
      RACECAR_SERVICE_NAME: "racecar-35 cloud"
      RACECAR_MAX_BODY_BYTES: "67108864"
      # OAuth for the browser UI. Behind HTTPS the redirect URI must be https://
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      RACECAR_SESSION_SECRET: "${RACECAR_SESSION_SECRET:-}"
      RACECAR_ALLOWED_EMAILS: "${RACECAR_ALLOWED_EMAILS:-}"
      # Bootstrap admin(s) for the /admin portal. Always allowed + always admin.
      RACECAR_ADMIN_EMAILS: "${RACECAR_ADMIN_EMAILS:-}"
      # Behind HTTPS (TLS terminated at the external proxy), mark cookies Secure.
      RACECAR_COOKIE_SECURE: "${RACECAR_COOKIE_SECURE:-1}"
      RACECAR_SESSION_TTL_SECONDS: "${RACECAR_SESSION_TTL_SECONDS:-604800}"
    volumes:
      - ./data:/data
    networks:
      # nginx (bluecloud-proxy) reaches this container by name on proxy_default.
      - proxy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; \
              sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8089/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

networks:
  # The /docker/proxy/ nginx (bluecloud-proxy) lives on `proxy_default`.
  # Joining it lets nginx proxy_pass to http://racecar35-cloud:8089 by name.
  proxy:
    external: true
    name: proxy_default
