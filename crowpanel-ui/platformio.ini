; PlatformIO project for the CrowPanel ESP32-S3 7" 800x480 (HMI v3.0)
; Renders the racecar-35 dash UI from GPS data received over UART0
; (GPIO43 TX, GPIO44 RX) from the Teensy 4.1 on Serial3.
;
; Flash via the CrowPanel's USB-C port. Disconnect the two UART jumpers
; to the Teensy first — UART0 is shared with the CH340 used for upload.

[env:crowpanel_s3_7]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; ESP32-S3-WROOM-1 N4R8: 4 MB flash, 8 MB Octal PSRAM.
; (esptool reports 4 MB on this CrowPanel revision.)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0                  ; Serial = UART0 (GPIO43/44), where Teensy + CH340 live
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
