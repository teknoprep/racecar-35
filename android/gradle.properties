org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
# Serialize Gradle worker actions. On this many-core Linux host AGP 8.5.2's
# PARALLEL dex workers race and hand one D8 bucket the same .class twice, so
# every app class fails with "Type ... is defined multiple times" and
# assembleDebug aborts. (D8 on the same classes runs clean standalone, and the
# build succeeds with workers.max=1 — it's a dex-worker concurrency bug, not our
# code.) numberOfBuckets is ignored in AGP 8.5, so cap workers instead.
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
