<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1434" viewBox="0 0 1700 1434"><rect width="1700" height="1434" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">Analogue inputs — oil, coolant, AEM AFR (and the optional CAN + SD)</text><text x="48" y="84" class="s" style="fill:#555">Every one of these is a divider or a pull-up in front of an ADC pin. Values are firmware contracts, not suggestions.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" fill="#f4d2c4" stroke="#a33" stroke-width="1.5"/><text x="62" y="130" class="xs">The Teensy ADC is 3.3 V. A raw 5 V sensor output, or the AEM WHITE wire, will damage the pin — the divider is not optional.</text><text x="62" y="156" class="xs">Meter each one at a known input voltage before enabling it in Settings.</text><rect x="48" y="224" width="790" height="410" rx="8" class="panel"/><text x="66" y="258" class="h">Oil pressure — J5 -&gt; pin 16 (A2)</text><text x="66" y="320" class="v">J5 SIG</text><line x1="150" y1="314" x2="200" y2="314" class="wire"/><polyline points="200.0,314.0 210.8,328.0 232.5,300.0 254.2,328.0 275.8,300.0 297.5,328.0 319.2,300.0 330.0,314.0" class="comp"/><text x="265" y="294" class="xs" text-anchor="middle">10 kΩ</text><line x1="330" y1="314" x2="430" y2="314" class="wire"/><circle cx="400" cy="314" r="7" fill="#1b2420"/><rect x="430" y="292" width="380" height="44" rx="8" class="box"/><text x="620.0" y="310.0" class="s" text-anchor="middle">Teensy pin 16 (A2)</text><text x="620.0" y="334.0" class="xs" text-anchor="middle" style="fill:#666">oil PSI</text><line x1="400" y1="314" x2="400" y2="374" class="wire"/><polyline points="400.0,374.0 414.0,383.2 386.0,401.5 414.0,419.8 386.0,438.2 414.0,456.5 386.0,474.8 400.0,484.0" class="comp"/><text x="442" y="436" class="xs">20 kΩ</text><line x1="400" y1="484" x2="400" y2="504" class="wire"/><line x1="374" y1="504" x2="426" y2="504" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="385" y1="516" x2="415" y2="516" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="395" y1="528" x2="405" y2="528" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><text x="438" y="516" class="xs">GND rail</text><text x="66" y="554" class="xs">Firmware expects  V_adc = V_sensor × 2/3</text><text x="66" y="582" class="v">0.50 V in -&gt; 0.33 V on A2      |      4.50 V in -&gt; 3.00 V on A2</text><text x="66" y="610" class="xs" style="fill:#666">A genuine 0.5-4.5 V sender reads ~0.5 V at atmosphere when powered.</text><rect x="862" y="224" width="790" height="410" rx="8" class="panel"/><text x="880" y="258" class="h">Coolant — J6 -&gt; pin 17 (A3)</text><text x="880" y="320" class="v">3.3 V rail</text><line x1="990" y1="314" x2="1040" y2="314" class="wire"/><polyline points="1040.0,314.0 1050.0,328.0 1070.0,300.0 1090.0,328.0 1110.0,300.0 1130.0,328.0 1150.0,300.0 1160.0,314.0" class="comp"/><text x="1100" y="294" class="xs" text-anchor="middle">150 Ω</text><line x1="1160" y1="314" x2="1290" y2="314" class="wire"/><circle cx="1230" cy="314" r="7" fill="#1b2420"/><rect x="1290" y="292" width="330" height="44" rx="8" class="box"/><text x="1455.0" y="310.0" class="s" text-anchor="middle">Teensy pin 17 (A3)</text><text x="1455.0" y="334.0" class="xs" text-anchor="middle" style="fill:#666">coolant °F</text><text x="880" y="380" class="v">J6 SIG</text><line x1="980" y1="374" x2="1230" y2="374" class="wire"/><line x1="1230" y1="314" x2="1230" y2="374" class="wire"/><text x="880" y="424" class="v">J6 GND</text><line x1="980" y1="418" x2="1050" y2="418" class="wire"/><line x1="1050" y1="418" x2="1050" y2="438" class="wire"/><line x1="1024" y1="438" x2="1076" y2="438" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="1035" y1="450" x2="1065" y2="450" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="1045" y1="462" x2="1055" y2="462" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><text x="1088" y="450" class="xs">its own wire to the GND rail</text><text x="880" y="516" class="xs">VDO 1600-22 Ω curve: 700 Ω at 100 °F, 110 Ω at 180 °F, 22 Ω at 250 °F.</text><text x="880" y="544" class="xs" style="fill:#666">A different sender needs a different pull-up and new coefficients in src/main.cpp.</text><text x="880" y="572" class="xs" style="fill:#666">Do not rely on the engine block for the sender ground — run the wire.</text><rect x="48" y="674" width="790" height="470" rx="8" class="panel"/><text x="66" y="708" class="h">AEM 30-0300 gauge output — J7 -&gt; pin 20 (A6)</text><text x="66" y="770" class="v">J7 WHT</text><line x1="160" y1="764" x2="210" y2="764" class="wire"/><polyline points="210.0,764.0 220.8,778.0 242.5,750.0 264.2,778.0 285.8,750.0 307.5,778.0 329.2,750.0 340.0,764.0" class="comp"/><text x="275" y="744" class="xs" text-anchor="middle">20 kΩ 0.1%</text><line x1="340" y1="764" x2="400" y2="764" class="wire"/><circle cx="400" cy="764" r="8" fill="#1b2420"/><polyline points="400.0,764.0 410.8,778.0 432.5,750.0 454.2,778.0 475.8,750.0 497.5,778.0 519.2,750.0 530.0,764.0" class="comp"/><text x="470" y="744" class="xs" text-anchor="middle">20 kΩ 0.1%</text><line x1="530" y1="764" x2="610" y2="764" class="wire"/><text x="610" y="770" class="v">J7 BRN -&gt; GND</text><line x1="400" y1="764" x2="400" y2="784" class="wire"/><polyline points="400.0,784.0 414.0,791.5 386.0,806.5 414.0,821.5 386.0,836.5 414.0,851.5 386.0,866.5 400.0,874.0" class="comp"/><text x="442" y="838" class="xs">1 kΩ</text><line x1="400" y1="874" x2="400" y2="906" class="wire"/><line x1="400" y1="906" x2="470" y2="906" class="wire"/><circle cx="440" cy="906" r="7" fill="#1b2420"/><rect x="470" y="884" width="340" height="44" rx="8" class="box"/><text x="640.0" y="902.0" class="s" text-anchor="middle">Teensy pin 20 (A6)</text><text x="640.0" y="926.0" class="xs" text-anchor="middle" style="fill:#666">AEM AFR</text><line x1="440" y1="906" x2="440" y2="954" class="wire"/><line x1="415" y1="954" x2="465" y2="954" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="415" y1="970" x2="465" y2="970" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="440" y1="970" x2="440" y2="994" class="wire"/><line x1="440" y1="994" x2="440" y2="1014" class="wire"/><line x1="414" y1="1014" x2="466" y2="1014" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="425" y1="1026" x2="455" y2="1026" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="435" y1="1038" x2="445" y2="1038" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><text x="484" y="1026" class="xs">100 nF  +  GND</text><text x="66" y="874" class="s" style="fill:#a33">5.00 V in -&gt; 2.50 V at pin 20</text><text x="66" y="902" class="xs" style="fill:#666">range 0.50-4.50 V = 8.50-18.00 AFR</text><text x="66" y="942" class="xs">Use BOTH AEM wires:</text><text x="66" y="966" class="xs" style="fill:#666">WHITE = pin 9 analogue +,  BROWN = pin 10 reference.</text><text x="66" y="996" class="xs" style="fill:#666">The gauge keeps its own 12 V supply and fuse.</text><rect x="862" y="674" width="790" height="470" rx="8" class="panel"/><text x="880" y="708" class="h">CAN (optional) — MS3Pro over SN65HVD230</text><text x="880" y="732" class="xs" style="fill:#666">Only needed when the sensor source is MegaSquirt.</text><rect x="886" y="740" width="250" height="56" rx="8" class="chip"/><text x="1011.0" y="774" class="s" text-anchor="middle">SN65HVD230</text><rect x="1378" y="740" width="250" height="56" rx="8" class="chip"/><text x="1503.0" y="774" class="s" text-anchor="middle">Teensy / bus</text><text x="1128" y="861" class="v" text-anchor="end">3V3</text><text x="1386" y="861" class="v" text-anchor="start">3.3 V</text><line x1="1156" y1="854" x2="1346.0" y2="854.0" class="wire"/><polygon points="1358.0,854.0 1343.0,860.0 1343.0,848.0" fill="#1b2420"/><text x="1257.0" y="880" class="xs" text-anchor="middle" style="fill:#666">a 5 V MCP2551 would damage the Teensy</text><text x="1128" y="913" class="v" text-anchor="end">GND</text><text x="1386" y="913" class="v" text-anchor="start">GND</text><line x1="1156" y1="906" x2="1358" y2="906" class="wire"/><text x="1257.0" y="932" class="xs" text-anchor="middle" style="fill:#666">star rail</text><text x="1128" y="965" class="v" text-anchor="end">CTX</text><text x="1386" y="965" class="v" text-anchor="start">pin 22  CAN1 TX</text><line x1="1156" y1="958" x2="1346.0" y2="958.0" class="wire"/><polygon points="1358.0,958.0 1343.0,964.0 1343.0,952.0" fill="#1b2420"/><text x="1128" y="1017" class="v" text-anchor="end">CRX</text><text x="1386" y="1017" class="v" text-anchor="start">pin 23  CAN1 RX</text><line x1="1358" y1="1010" x2="1168.0" y2="1010.0" class="wire"/><polygon points="1156.0,1010.0 1171.0,1004.0 1171.0,1016.0" fill="#1b2420"/><text x="1128" y="1069" class="v" text-anchor="end">CANH / CANL</text><text x="1386" y="1069" class="v" text-anchor="start">MS3Pro</text><line x1="1156" y1="1062" x2="1358" y2="1062" class="wire"/><text x="1257.0" y="1088" class="xs" text-anchor="middle" style="fill:#666">120 Ω terminator at the end of the bus</text><rect x="48" y="1184" width="1604" height="210" rx="8" class="panel"/><text x="66" y="1218" class="h">Settings that must stay OFF until the matching circuit exists</text><text x="66" y="1250" class="v">AEM 30-0300 AFR input        enable only after pin 20 meters 2.50 V with 5.00 V on J7 WHT-BRN.</text><text x="66" y="1276" class="v">Video interconnect           enable only after J3 is wired and the Pi answers at 115200.</text><text x="66" y="1302" class="v">Sensor data source           Direct (opto tach + ADCs) unless CAN or the BLE OBD dongle is fitted.</text><text x="66" y="1328" class="v">Tach pulses / rev            calibrate against a known RPM before trusting it — default 2.0.</text><text x="66" y="1354" class="xs">The SD card needs no wiring: it is the built-in socket on the back of the Teensy. FAT32, insert and go.</text></svg>