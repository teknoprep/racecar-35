<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1444" viewBox="0 0 1700 1444"><rect width="1700" height="1444" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">Power and ground — 12 V in, 5 V and 3.3 V rails</text><text x="48" y="84" class="s" style="fill:#555">The buck feeds the board; the Teensy makes its own 3.3 V; the Pi 5 has a separate supply.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" fill="#f4d2c4" stroke="#a33" stroke-width="1.5"/><text x="62" y="130" class="xs">NEVER put 12 V on J1. NEVER put 5 V on the Teensy 3.3V pin. NEVER put 5 V on J3 or a Pi GPIO.</text><text x="62" y="156" class="xs">Cut the Teensy VUSB-VIN pads (underside) if a USB cable and J1 5 V will be connected at the same time.</text><rect x="48" y="224" width="1604" height="480" rx="8" class="panel"/><text x="66" y="258" class="h">5 V rail — 12 V battery in, everything else comes off J1</text><rect x="90" y="300" width="230" height="48" rx="8" class="box"/><text x="205.0" y="320.0" class="s" text-anchor="middle">12 V battery +</text><text x="205.0" y="344.0" class="xs" text-anchor="middle" style="fill:#666">through a chassis fuse</text><line x1="320" y1="324" x2="370" y2="324" class="wire"/><rect x="370" y="300" width="150" height="48" rx="8" class="box"/><text x="445.0" y="331.0" class="s" text-anchor="middle">5 A fuse</text><line x1="520" y1="324" x2="570" y2="324" class="wire"/><rect x="570" y="300" width="260" height="48" rx="8" class="box"/><text x="700.0" y="320.0" class="s" text-anchor="middle">5 V buck</text><text x="700.0" y="344.0" class="xs" text-anchor="middle" style="fill:#666">3 A or better</text><line x1="830" y1="324" x2="880" y2="324" class="wire"/><line x1="880" y1="274" x2="880" y2="474" class="wire" style="stroke-width:6"/><text x="770" y="384" class="xs" text-anchor="middle" style="fill:#a33">measure 5.00 V here</text><text x="770" y="404" class="xs" text-anchor="middle" style="fill:#a33">before anything is connected</text><line x1="880" y1="274" x2="940" y2="274" class="wire"/><rect x="940" y="252" width="430" height="44" rx="8" class="box"/><text x="1155.0" y="270.0" class="s" text-anchor="middle">Teensy 5V (VIN pin)</text><text x="1155.0" y="294.0" class="xs" text-anchor="middle" style="fill:#666">top-right header pin</text><line x1="880" y1="374" x2="940" y2="374" class="wire"/><rect x="940" y="352" width="430" height="44" rx="8" class="box"/><text x="1155.0" y="370.0" class="s" text-anchor="middle">J2 5V  -&gt;  CrowPanel J10</text><text x="1155.0" y="394.0" class="xs" text-anchor="middle" style="fill:#666">+5V_IN pin</text><line x1="880" y1="474" x2="940" y2="474" class="wire"/><rect x="940" y="452" width="430" height="44" rx="8" class="box"/><text x="1155.0" y="470.0" class="s" text-anchor="middle">J5 5V  -&gt;  oil sender</text><text x="1155.0" y="494.0" class="xs" text-anchor="middle" style="fill:#666">transducer supply</text><line x1="160" y1="644" x2="880" y2="644" class="wire" style="stroke:#0a6;stroke-width:8"/><text x="176" y="678" class="s">battery -  and  buck OUT-  -&gt;  GND rail (see the ground card)</text><line x1="205" y1="348" x2="205" y2="644" class="wire" style="stroke:#0a6;stroke-width:6"/><line x1="640" y1="348" x2="640" y2="644" class="wire" style="stroke:#0a6;stroke-width:6"/><text x="66" y="554" class="xs" style="fill:#666">Nothing else hangs off the 5 V rail — the screen is the only other 5 V load.</text><rect x="48" y="744" width="790" height="400" rx="8" class="panel"/><text x="66" y="778" class="h">3.3 V rail — made by the Teensy itself</text><line x1="150" y1="824" x2="150" y2="1064" class="wire" style="stroke-width:6"/><text x="150" y="812" class="xs" text-anchor="middle">Teensy 3.3V pin</text><circle cx="150" cy="824" r="7" fill="#1b2420"/><line x1="150" y1="824" x2="240" y2="824" class="wire"/><rect x="240" y="802" width="560" height="44" rx="8" class="box"/><text x="520.0" y="820.0" class="s" text-anchor="middle">GPS VCC</text><text x="520.0" y="844.0" class="xs" text-anchor="middle" style="fill:#666">u-blox NEO-M9N</text><circle cx="150" cy="904" r="7" fill="#1b2420"/><line x1="150" y1="904" x2="240" y2="904" class="wire"/><rect x="240" y="882" width="560" height="44" rx="8" class="box"/><text x="520.0" y="900.0" class="s" text-anchor="middle">IMU VCC</text><text x="520.0" y="924.0" class="xs" text-anchor="middle" style="fill:#666">GY-521 MPU-6050</text><circle cx="150" cy="984" r="7" fill="#1b2420"/><line x1="150" y1="984" x2="240" y2="984" class="wire"/><rect x="240" y="962" width="560" height="44" rx="8" class="box"/><text x="520.0" y="980.0" class="s" text-anchor="middle">R2 4.7 kΩ -&gt; PC817 pin 4 / pin 9</text><text x="520.0" y="1004.0" class="xs" text-anchor="middle" style="fill:#666">tach pull-up</text><circle cx="150" cy="1064" r="7" fill="#1b2420"/><line x1="150" y1="1064" x2="240" y2="1064" class="wire"/><rect x="240" y="1042" width="560" height="44" rx="8" class="box"/><text x="520.0" y="1060.0" class="s" text-anchor="middle">150 Ω -&gt; coolant sender (J6)</text><text x="520.0" y="1084.0" class="xs" text-anchor="middle" style="fill:#666">pull-up at A3</text><text x="66" y="1112" class="xs" style="fill:#666">PJRC rates the 3.3V pin for about 250 mA of external load — GPS + IMU + two pull-ups</text><text x="66" y="1134" class="xs" style="fill:#666">is a few tens of mA, so there is plenty of headroom. Do not hang a screen or a Pi off it.</text><rect x="862" y="744" width="790" height="400" rx="8" class="panel"/><text x="880" y="778" class="h">Ground — one star point</text><line x1="910" y1="820" x2="910" y2="1060" class="wire" style="stroke:#0a6;stroke-width:8"/><line x1="910" y1="828" x2="960" y2="828" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="833" class="xs">J1 GND  (buck OUT−)</text><line x1="910" y1="848" x2="960" y2="848" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="853" class="xs">J2 GND  (screen)</text><line x1="910" y1="868" x2="960" y2="868" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="873" class="xs">J3 GND  (Pi)</text><line x1="910" y1="888" x2="960" y2="888" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="893" class="xs">J4 GND  (tach opto)</text><line x1="910" y1="908" x2="960" y2="908" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="913" class="xs">J5 GND  (oil)</text><line x1="910" y1="928" x2="960" y2="928" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="933" class="xs">J6 GND  (coolant — own wire)</text><line x1="910" y1="948" x2="960" y2="948" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="953" class="xs">J7 BRN  (AEM reference)</text><line x1="910" y1="968" x2="960" y2="968" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="973" class="xs">Teensy GND  (both pins)</text><line x1="910" y1="988" x2="960" y2="988" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="993" class="xs">GPS GND</text><line x1="910" y1="1008" x2="960" y2="1008" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="1013" class="xs">IMU GND</text><line x1="910" y1="1028" x2="960" y2="1028" class="wire" style="stroke:#0a6;stroke-width:3"/><text x="968" y="1033" class="xs">CAN GND  (optional)</text><text x="1240" y="864" class="s">Rules:</text><text x="1240" y="896" class="xs" style="fill:#666">Every return lands on this one rail.</text><text x="1240" y="922" class="xs" style="fill:#666">Never daisy-chain grounds through the engine block.</text><text x="1240" y="948" class="xs" style="fill:#666">The coolant sender needs its own return wire.</text><text x="1240" y="974" class="xs" style="fill:#666">Keep the tach and GPS returns apart until here.</text><text x="1240" y="1000" class="xs" style="fill:#666">The screen and the Pi have their own supplies —</text><text x="1240" y="1026" class="xs" style="fill:#666">only their GND / signals come to this board.</text><rect x="48" y="1184" width="1604" height="220" rx="8" class="panel"/><text x="66" y="1218" class="h">Before you power up</text><text x="66" y="1250" class="v">1.  Buck unloaded: 5.00 V.   With the Teensy connected: 4.8-5.2 V.   Adjust or replace it if not.</text><text x="66" y="1276" class="v">2.  Cut the VUSB-VIN pads on the Teensy underside if USB and J1 will both be live.</text><text x="66" y="1302" class="v">3.  Ohmmeter, everything off: 5 V rail to GND is not a short.   3.3 V rail to GND is not a short.</text><text x="66" y="1328" class="v">4.  Pi 5 keeps its OWN 5 V 5 A USB-C supply — J3 carries only GND, TX and RX.</text><text x="66" y="1354" class="v">5.  3.3 V comes out of the Teensy. Never feed 3.3 V INTO the 3.3V pin.</text></svg>