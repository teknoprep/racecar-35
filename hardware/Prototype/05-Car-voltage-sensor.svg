<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1760" viewBox="0 0 1700 1760"><rect width="1700" height="1760" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">Car voltage sensor — 12–16 V in, 1.2–1.6 V on Teensy pin 40 (A16)</text><text x="48" y="84" class="s" style="fill:#555">Two resistors divide the car voltage by exactly 10. Same divider, same pin, same firmware as the Rev F board.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" style="fill:#f4d2c4;stroke:#a33;stroke-width:1.5"/><text x="62" y="130" class="xs">NEVER connect 12 V (or any wire from the car) straight to a Teensy pin — it dies above 3.6 V. Always through R1 180 kΩ.</text><text x="62" y="156" class="xs">The 1:10 ratio is a firmware constant (VIN_DIVIDER_RATIO = 10.0). Use exactly 180 kΩ over 20 kΩ, 1 % metal film. Needs firmware v0.1.172 or newer.</text><text x="48" y="224" class="h">1. Solder exactly this — four parts and two small diodes</text><rect x="70" y="402" width="200" height="64" rx="8" class="term"/><text x="170.0" y="432" class="s" text-anchor="middle" style="fill:#f5e6a8">J8  V+</text><text x="170.0" y="452" class="xs" text-anchor="middle" style="fill:#dddddd">fused car +12 V</text><rect x="70" y="702" width="200" height="64" rx="8" class="term"/><text x="170.0" y="732" class="s" text-anchor="middle" style="fill:#f5e6a8">J8  GND</text><text x="170.0" y="752" class="xs" text-anchor="middle" style="fill:#dddddd">car ground</text><text x="170" y="364" class="xs" text-anchor="middle" style="fill:#666">same fused feed as the</text><text x="170" y="384" class="xs" text-anchor="middle" style="fill:#666">5 V buck input (after the fuse)</text><line x1="270" y1="434" x2="340" y2="434" class="wire"/><polyline points="340.0,434.0 354.2,448.0 382.5,420.0 410.8,448.0 439.2,420.0 467.5,448.0 495.8,420.0 510.0,434.0" class="comp"/><text x="425" y="404" class="s" text-anchor="middle">R1  180 kΩ  1 %</text><text x="425" y="356" class="xs" text-anchor="middle" style="fill:#666">sets the ratio AND limits fault</text><text x="425" y="376" class="xs" text-anchor="middle" style="fill:#666">current (100 V → 0.5 mA)</text><line x1="510" y1="434" x2="760" y2="434" class="wire"/><circle cx="640" cy="434" r="9" fill="#1b2420"/><text x="626" y="418" class="pin" text-anchor="end">A</text><polyline points="760.0,434.0 769.2,448.0 787.5,420.0 805.8,448.0 824.2,420.0 842.5,448.0 860.8,420.0 870.0,434.0" class="comp"/><text x="815" y="404" class="s" text-anchor="middle">R3  1 kΩ</text><line x1="870" y1="434" x2="1150" y2="434" class="wire"/><circle cx="930" cy="434" r="8" fill="#1b2420"/><text x="944" y="418" class="pin">B</text><rect x="1150" y="404" width="300" height="60" rx="8" class="chip"/><text x="1300" y="430" class="s" text-anchor="middle">Teensy 4.1  pin 40</text><text x="1300" y="452" class="xs" text-anchor="middle" style="fill:#666">A16  (ADC1)</text><line x1="640" y1="434" x2="640" y2="374" class="wire"/><polygon points="620,374 660,374 640,330" fill="#f7f4ee" stroke="#1b2420" stroke-width="2.5"/><line x1="620" y1="330" x2="660" y2="330" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="620" y1="330" x2="620" y2="337" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="620" y1="337" x2="614" y2="337" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="660" y1="330" x2="660" y2="323" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="660" y1="323" x2="666" y2="323" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="640" y1="330" x2="640" y2="284" class="wire"/><circle cx="640" cy="284" r="7" fill="#1b2420"/><text x="656" y="290" class="v">3.3 V  (Teensy 3.3V pin / rail)</text><text x="680" y="342" class="xs">D1  BAT85 Schottky</text><text x="680" y="362" class="xs" style="fill:#a33">band (K) UP toward 3.3 V</text><line x1="640" y1="434" x2="640" y2="534" class="wire"/><polyline points="640.0,534.0 654.0,544.0 626.0,564.0 654.0,584.0 626.0,604.0 654.0,624.0 626.0,644.0 640.0,654.0" class="comp"/><text x="666" y="584" class="s">R2  20 kΩ  1 %</text><text x="666" y="606" class="xs" style="fill:#666">bottom of the divider</text><line x1="640" y1="654" x2="640" y2="734" class="wire"/><circle cx="640" cy="734" r="7" fill="#1b2420"/><line x1="640" y1="494" x2="520" y2="494" class="wire"/><circle cx="640" cy="494" r="7" fill="#1b2420"/><line x1="520" y1="494" x2="520" y2="584" class="wire"/><polygon points="500,628 540,628 520,584" fill="#f7f4ee" stroke="#1b2420" stroke-width="2.5"/><line x1="500" y1="584" x2="540" y2="584" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="500" y1="584" x2="500" y2="591" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="500" y1="591" x2="494" y2="591" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="540" y1="584" x2="540" y2="577" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="540" y1="577" x2="546" y2="577" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="520" y1="628" x2="520" y2="734" class="wire"/><circle cx="520" cy="734" r="7" fill="#1b2420"/><text x="490" y="602" class="xs" text-anchor="end">D2  BAT85 Schottky</text><text x="490" y="622" class="xs" text-anchor="end" style="fill:#a33">band (K) UP toward A</text><text x="490" y="642" class="xs" text-anchor="end" style="fill:#666">catches reverse / negative spikes</text><line x1="930" y1="434" x2="930" y2="584" class="wire"/><line x1="907.0" y1="584" x2="953.0" y2="584" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="907.0" y1="598" x2="953.0" y2="598" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="930" y1="598" x2="930" y2="734" class="wire"/><circle cx="930" cy="734" r="7" fill="#1b2420"/><text x="966" y="586" class="s">C1  100 nF ceramic</text><text x="966" y="608" class="xs" style="fill:#666">at pin 40: filters noise,</text><text x="966" y="628" class="xs" style="fill:#666">feeds the ADC sample</text><line x1="270" y1="734" x2="340" y2="734" class="wire" style="stroke:#0a6;stroke-width:8"/><line x1="270" y1="734" x2="1450" y2="734" class="wire" style="stroke:#0a6;stroke-width:8"/><text x="290" y="770" class="s">GND rail — the star point, shared with J1 GND and the Teensy GND pins</text><rect x="1280" y="504" width="320" height="200" rx="8" class="box" style="fill:#ffffff;stroke:#1b2420;stroke-width:2"/><text x="1300" y="534" class="v">J8 V+      pin 40</text><line x1="1294" y1="544" x2="1586" y2="544" class="wire" style="stroke:#999;stroke-width:1.5"/><text x="1300" y="570" class="v">12.0 V     1.20 V</text><text x="1300" y="596" class="v">13.8 V     1.38 V</text><text x="1300" y="622" class="v">14.4 V     1.44 V</text><text x="1300" y="648" class="v">16.0 V     1.60 V</text><text x="1300" y="674" class="v" style="fill:#a33">33.0 V     3.30 V  (ADC max)</text><text x="48" y="824" class="h">2. Which way round the diodes go — the BAND is the cathode (K)</text><line x1="220" y1="914" x2="280" y2="914" class="wire"/><line x1="380" y1="914" x2="440" y2="914" class="wire"/><rect x="280" y="896" width="100" height="36" rx="10" class="box" style="fill:#e8d7b0;stroke:#1b2420;stroke-width:2.5"/><rect x="356" y="896" width="16" height="36" rx="2" class="box" style="fill:#1b2420;stroke:#1b2420;stroke-width:1"/><text x="212" y="920" class="pin" text-anchor="end">A</text><text x="448" y="920" class="pin">K</text><text x="330" y="884" class="xs" text-anchor="middle">D1:  A = midpoint A   ·   K (band) = 3.3 V rail</text><text x="330" y="958" class="xs" text-anchor="middle" style="fill:#666">conducts only if A rises above about 3.6 V</text><line x1="890" y1="914" x2="950" y2="914" class="wire"/><line x1="1050" y1="914" x2="1110" y2="914" class="wire"/><rect x="950" y="896" width="100" height="36" rx="10" class="box" style="fill:#e8d7b0;stroke:#1b2420;stroke-width:2.5"/><rect x="1026" y="896" width="16" height="36" rx="2" class="box" style="fill:#1b2420;stroke:#1b2420;stroke-width:1"/><text x="882" y="920" class="pin" text-anchor="end">A</text><text x="1118" y="920" class="pin">K</text><text x="1000" y="884" class="xs" text-anchor="middle">D2:  A = GND rail   ·   K (band) = midpoint A</text><text x="1000" y="958" class="xs" text-anchor="middle" style="fill:#666">conducts only if A goes below about −0.3 V</text><text x="1370" y="900" class="xs">BAT85, BAT43, 1N5817,</text><text x="1370" y="922" class="xs">1N5819 — any small</text><text x="1370" y="944" class="xs">Schottky is fine.</text><rect x="48" y="994" width="1604" height="150" rx="8" class="box" style="fill:#fffbe8;stroke:#c9a227;stroke-width:2"/><text x="70" y="1026" class="h">3. Bench check — BEFORE the car or the dash setting</text><text x="70" y="1058" class="v">1)  Power OFF, ohmmeter: J8 V+ to J8 GND ≈ 200 kΩ.   A to pin 40 = 1 kΩ.   J8 V+ must NOT read 0 Ω to 3.3 V or 5 V.</text><text x="70" y="1086" class="v">2)  Teensy powered, bench supply 12.00 V on J8:  pin 40 must read 1.200 V  (±0.03 V with 1 % parts).</text><text x="70" y="1114" class="v">3)  Bench supply off / J8 open:  pin 40 reads 0 V.    Anything near 3.3 V = R2 missing or R1/R2 swapped — STOP.</text><rect x="48" y="1164" width="1604" height="300" rx="8" class="box" style="fill:#ffffff;stroke:#1b2420;stroke-width:2"/><text x="66" y="1196" class="h">4. Solder order — divider first, protection second, Teensy wire last</text><text x="66" y="1230" class="v">1.  J8 V+  →  R1 180 kΩ  →  a free row = midpoint A.</text><text x="66" y="1259" class="v">2.  R2 20 kΩ from A  →  GND rail.           (now meter step 1 above)</text><text x="66" y="1288" class="v">3.  D1: anode on A, BAND to the 3.3 V rail.     D2: anode on the GND rail, BAND on A.</text><text x="66" y="1317" class="v">4.  R3 1 kΩ from A  →  node B.     C1 100 nF from B  →  GND rail, as close to pin 40 as you can.</text><text x="66" y="1346" class="v">5.  J8 GND  →  GND rail.     Bench check step 2 with a 12 V supply on J8.</text><text x="66" y="1375" class="v">6.  LAST: node B  →  Teensy pin 40 (A16).     Pin 40 is on the long edge, between 39 and 41.</text><text x="66" y="1404" class="v">7.  Dash: Settings → Sensor monitoring → tap VOLT → Source = DIRECT → BACK → DONE.</text><text x="66" y="1433" class="v">     The Teensy only reads / logs pin 40 after that (CFG,vdir,1). Leave it off until the divider exists.</text><rect x="48" y="1484" width="792" height="236" rx="8" class="panel"/><text x="66" y="1518" class="h">Why not “1–3 V”, and why not a Zener</text><text x="66" y="1550" class="xs">1:10 reads up to 33 V before the ADC saturates, so a charging spike or a</text><text x="66" y="1576" class="xs">jump start never reaches the pin — and 8 mV per step is plenty of resolution.</text><text x="66" y="1602" class="xs">A 3.3 V Zener as the clamp LEAKS long before its knee (up to 100 µA at 1 V):</text><text x="66" y="1628" class="xs">on this 18 kΩ source that drags the reading several percent low.</text><text x="66" y="1654" class="xs">Schottky-to-rail does not. Rev F uses an LM4040-3.0 shunt for the same reason.</text><text x="66" y="1680" class="xs">Divider draws ~70 µA — fine even on an always-on feed.</text><rect x="864" y="1484" width="788" height="236" rx="8" class="panel"/><text x="882" y="1518" class="h">Parts — everything for this sensor</text><text x="882" y="1550" class="v">R1  180 kΩ  1 % metal film  ¼ W</text><text x="882" y="1576" class="v">R2   20 kΩ  1 % metal film  ¼ W</text><text x="882" y="1602" class="v">R3    1 kΩ  ¼ W      C1  100 nF ceramic</text><text x="882" y="1628" class="v">D1, D2  BAT85 / BAT43 / 1N5817 Schottky</text><text x="882" y="1654" class="v">J8  2-position 5.08 mm screw terminal</text><text x="882" y="1680" class="xs">0.1 % resistors tighten the ±0.3 V (at 14 V) worst case to ±0.03 V.</text></svg>