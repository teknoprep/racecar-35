<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1024" viewBox="0 0 1700 1024"><rect width="1700" height="1024" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">The two UART cables — screen (921600) and Pi 5 video (115200)</text><text x="48" y="84" class="s" style="fill:#555">Both are crossed TX/RX plus ground, but they are different voltages and different baud rates. Do not mix them up.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" fill="#f4d2c4" stroke="#a33" stroke-width="1.5"/><text x="62" y="130" class="xs">Disconnect J2 TX/RX before USB-flashing the CrowPanel — its UART0 is shared with the CH340 uploader.</text><text x="62" y="156" class="xs">J3 is 3.3 V ONLY. The Pi and the Teensy must share ground or neither link works.</text><rect x="48" y="224" width="790" height="520" rx="8" class="panel"/><text x="66" y="258" class="h">J2 SCREEN -&gt; CrowPanel J10</text><text x="66" y="282" class="xs" style="fill:#666">XH2.54 4-pin header only. 921600 8N1.</text><rect x="72" y="290" width="250" height="56" rx="8" class="chip"/><text x="197.0" y="324" class="s" text-anchor="middle">Teensy 4.1</text><rect x="564" y="290" width="250" height="56" rx="8" class="chip"/><text x="689.0" y="324" class="s" text-anchor="middle">CrowPanel J10</text><text x="314" y="411" class="v" text-anchor="end">GND</text><text x="572" y="411" class="v" text-anchor="start">GND</text><line x1="342" y1="404" x2="544" y2="404" class="wire"/><text x="443.0" y="430" class="xs" text-anchor="middle" style="fill:#666">shared ground — mandatory</text><text x="314" y="477" class="v" text-anchor="end">pin 14  TX3</text><text x="572" y="477" class="v" text-anchor="start">RXD0_H</text><line x1="342" y1="470" x2="532.0" y2="470.0" class="wire"/><polygon points="544.0,470.0 529.0,476.0 529.0,464.0" fill="#1b2420"/><text x="443.0" y="496" class="xs" text-anchor="middle" style="fill:#666">crossed: Teensy TX -&gt; screen RX</text><text x="314" y="543" class="v" text-anchor="end">pin 15  RX3</text><text x="572" y="543" class="v" text-anchor="start">TXD0_H</text><line x1="544" y1="536" x2="354.0" y2="536.0" class="wire"/><polygon points="342.0,536.0 357.0,530.0 357.0,542.0" fill="#1b2420"/><text x="443.0" y="562" class="xs" text-anchor="middle" style="fill:#666">crossed: screen TX -&gt; Teensy RX</text><text x="314" y="609" class="v" text-anchor="end">J1 5 V</text><text x="572" y="609" class="v" text-anchor="start">+5V_IN</text><line x1="342" y1="602" x2="532.0" y2="602.0" class="wire"/><polygon points="544.0,602.0 529.0,608.0 529.0,596.0" fill="#1b2420"/><text x="443.0" y="628" class="xs" text-anchor="middle" style="fill:#666">or power the screen from its own USB-C</text><text x="66" y="652" class="xs" style="fill:#a33">NEVER use the small HY2.0 header on the screen: its 3V3_OUT pin</text><text x="66" y="674" class="xs" style="fill:#a33">is an OUTPUT — 5 V there kills the ESP32.</text><text x="66" y="710" class="xs" style="fill:#666">A 5" Advance needs the -DDASH_BOARD=51 build; a 7" the =71 build.</text><rect x="862" y="224" width="790" height="520" rx="8" class="panel"/><text x="880" y="258" class="h">J3 VIDEO -&gt; Raspberry Pi 5</text><text x="880" y="282" class="xs" style="fill:#666">3.3 V logic only. 115200 8N1.</text><rect x="886" y="290" width="250" height="56" rx="8" class="chip"/><text x="1011.0" y="324" class="s" text-anchor="middle">Teensy 4.1</text><rect x="1378" y="290" width="250" height="56" rx="8" class="chip"/><text x="1503.0" y="324" class="s" text-anchor="middle">Pi 5 40-pin header</text><text x="1128" y="411" class="v" text-anchor="end">GND</text><text x="1386" y="411" class="v" text-anchor="start">pin 6  GND</text><line x1="1156" y1="404" x2="1358" y2="404" class="wire"/><text x="1257.0" y="430" class="xs" text-anchor="middle" style="fill:#666">shared ground</text><text x="1128" y="477" class="v" text-anchor="end">pin 1  TX1</text><text x="1386" y="477" class="v" text-anchor="start">pin 10  GPIO15 RXD</text><line x1="1156" y1="470" x2="1346.0" y2="470.0" class="wire"/><polygon points="1358.0,470.0 1343.0,476.0 1343.0,464.0" fill="#1b2420"/><text x="1257.0" y="496" class="xs" text-anchor="middle" style="fill:#666">1 kΩ in series, in the cable</text><text x="1128" y="543" class="v" text-anchor="end">pin 0  RX1</text><text x="1386" y="543" class="v" text-anchor="start">pin 8  GPIO14 TXD</text><line x1="1358" y1="536" x2="1168.0" y2="536.0" class="wire"/><polygon points="1156.0,536.0 1171.0,530.0 1171.0,542.0" fill="#1b2420"/><text x="1257.0" y="562" class="xs" text-anchor="middle" style="fill:#666">1 kΩ in series, in the cable</text><text x="1128" y="609" class="v" text-anchor="end">--</text><text x="1386" y="609" class="v" text-anchor="start">--</text><line x1="1156" y1="602" x2="1358" y2="602" class="wire"/><text x="1257.0" y="628" class="xs" text-anchor="middle" style="fill:#666">no power pins — the Pi has its own 5 V supply</text><text x="880" y="654" class="v">Pi config:  dtparam=uart0=on   and   usb_max_current_enable=1</text><text x="880" y="680" class="xs" style="fill:#666">Cameras and the USB stick live on the Pi, not on this board.</text><rect x="48" y="784" width="1604" height="200" rx="8" class="panel"/><text x="66" y="818" class="h">Which cable is which</text><text x="66" y="850" class="v">J2 SCREEN   Teensy pin 14 / 15   &lt;-&gt;  CrowPanel J10 RXD0_H / TXD0_H    921600   screen is 5 V-tolerant behind its shifters</text><text x="66" y="876" class="v">J3 VIDEO    Teensy pin 1 / 0     &lt;-&gt;  Pi 5 GPIO15 / GPIO14             115200   3.3 V both ends — 5 V would damage the Pi</text><text x="66" y="902" class="xs">A UART wired to the wrong header produces nothing at all: no telemetry, no video status line. Check the crossing first.</text><text x="66" y="928" class="xs">Both links are line-oriented, \n terminated. The screen link carries the whole dash protocol; the Pi link only REC / TRACK / HUD.</text></svg>