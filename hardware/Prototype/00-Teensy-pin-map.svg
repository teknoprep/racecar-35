</style><text x="48" y="52" class="t">Prototype board — Teensy 4.1 pin map</text><text x="48" y="84" class="s" style="fill:#555">Every wire that lands on the Teensy. Car connections are the screw terminals J1–J7 on the left edge.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" fill="#f4d2c4" stroke="#a33" stroke-width="1.5"/><text x="62" y="130" class="xs">Header order follows the standard Teensy 4.1 layout — confirm the 5V / GND / 3.3V pins against the silkscreen on YOUR board before soldering.</text><text x="62" y="156" class="xs">Teensy 4.1 pins are NOT 5 V tolerant. The 3.3V pin is rated for about 250 mA of external load (PJRC).</text><rect x="600" y="232" width="500" height="1072" rx="18" class="box" fill="#f7f4ee" stroke="#1b2420" stroke-width="3"/><rect x="735" y="206" width="230" height="26" rx="6" class="box" fill="#dddddd" stroke="#1b2420" stroke-width="2"/><text x="850" y="224" class="xs" text-anchor="middle">USB-C  (flash from this end)</text><rect x="700" y="1318" width="300" height="26" rx="6" class="box" fill="#dddddd" stroke="#1b2420" stroke-width="2"/><text x="850" y="1338" class="xs" text-anchor="middle" style="fill:#666">micro-SD socket (on the back)</text><text x="850" y="262" class="h" text-anchor="middle" style="fill:#cccccc">TEENSY 4.1</text><line x1="600" y1="264" x2="552" y2="264" class="wire"/><circle cx="552" cy="264" r="7" fill="#1b2420"/><text x="614" y="270" class="v" text-anchor="start">GND</text><text x="538" y="270" class="v" text-anchor="end">GND rail — star point</text><line x1="600" y1="306" x2="552" y2="306" class="wire"/><circle cx="552" cy="306" r="7" fill="#1b2420"/><text x="614" y="312" class="v" text-anchor="start">0</text><text x="538" y="312" class="v" text-anchor="end">RX1  &lt;-  Pi GPIO14   (video, 1 kΩ)</text><line x1="600" y1="348" x2="552" y2="348" class="wire"/><circle cx="552" cy="348" r="7" fill="#1b2420"/><text x="614" y="354" class="v" text-anchor="start">1</text><text x="538" y="354" class="v" text-anchor="end">TX1  -&gt;  Pi GPIO15   (video, 1 kΩ)</text><line x1="600" y1="390" x2="552" y2="390" class="free"/><text x="614" y="396" class="v" text-anchor="start" style="fill:#9a9a9a">2</text><text x="538" y="396" class="v" text-anchor="end" style="fill:#9a9a9a">not used</text><line x1="600" y1="432" x2="552" y2="432" class="free"/><text x="614" y="438" class="v" text-anchor="start" style="fill:#9a9a9a">3</text><text x="538" y="438" class="v" text-anchor="end" style="fill:#9a9a9a">not used</text><line x1="600" y1="474" x2="552" y2="474" class="free"/><text x="614" y="480" class="v" text-anchor="start" style="fill:#9a9a9a">4</text><text x="538" y="480" class="v" text-anchor="end" style="fill:#9a9a9a">not used</text><line x1="600" y1="516" x2="552" y2="516" class="free"/><text x="614" y="522" class="v" text-anchor="start" style="fill:#9a9a9a">5</text><text x="538" y="522" class="v" text-anchor="end" style="fill:#9a9a9a">reserved — NET module, no firmware</text><line x1="600" y1="558" x2="552" y2="558" class="free"/><text x="614" y="564" class="v" text-anchor="start" style="fill:#9a9a9a">6</text><text x="538" y="564" class="v" text-anchor="end" style="fill:#9a9a9a">reserved — NET module, no firmware</text><line x1="600" y1="600" x2="552" y2="600" class="wire"/><circle cx="552" cy="600" r="7" fill="#1b2420"/><text x="614" y="606" class="v" text-anchor="start">7</text><text x="538" y="606" class="v" text-anchor="end">RX2  &lt;-  GPS TX</text><line x1="600" y1="642" x2="552" y2="642" class="wire"/><circle cx="552" cy="642" r="7" fill="#1b2420"/><text x="614" y="648" class="v" text-anchor="start">8</text><text x="538" y="648" class="v" text-anchor="end">TX2  -&gt;  GPS RX</text><line x1="600" y1="684" x2="552" y2="684" class="wire"/><circle cx="552" cy="684" r="7" fill="#1b2420"/><text x="614" y="690" class="v" text-anchor="start">9</text><text x="538" y="690" class="v" text-anchor="end">TACH  &lt;-  PC817 pin 4  (see the opto sheet)</text><line x1="600" y1="726" x2="552" y2="726" class="free"/><text x="614" y="732" class="v" text-anchor="start" style="fill:#9a9a9a">10</text><text x="538" y="732" class="v" text-anchor="end" style="fill:#9a9a9a">reserved — NET module, no firmware</text><line x1="600" y1="768" x2="552" y2="768" class="free"/><text x="614" y="774" class="v" text-anchor="start" style="fill:#9a9a9a">11</text><text x="538" y="774" class="v" text-anchor="end" style="fill:#9a9a9a">reserved — NET module, no firmware</text><line x1="600" y1="810" x2="552" y2="810" class="free"/><text x="614" y="816" class="v" text-anchor="start" style="fill:#9a9a9a">12</text><text x="538" y="816" class="v" text-anchor="end" style="fill:#9a9a9a">reserved — NET module, no firmware</text><line x1="600" y1="852" x2="552" y2="852" class="wire"/><circle cx="552" cy="852" r="7" fill="#1b2420"/><text x="614" y="858" class="v" text-anchor="start">3.3V</text><text x="538" y="858" class="v" text-anchor="end">3.3 V rail -&gt; GPS, IMU, 4.7 kΩ, 150 Ω</text><line x1="600" y1="894" x2="552" y2="894" class="free"/><text x="614" y="900" class="v" text-anchor="start" style="fill:#9a9a9a">24</text><text x="538" y="900" class="v" text-anchor="end" style="fill:#9a9a9a">not used  (Serial6 TX spare)</text><line x1="600" y1="936" x2="552" y2="936" class="free"/><text x="614" y="942" class="v" text-anchor="start" style="fill:#9a9a9a">25</text><text x="538" y="942" class="v" text-anchor="end" style="fill:#9a9a9a">not used  (Serial6 RX spare)</text><line x1="600" y1="978" x2="552" y2="978" class="free"/><text x="614" y="984" class="v" text-anchor="start" style="fill:#9a9a9a">26</text><text x="538" y="984" class="v" text-anchor="end" style="fill:#9a9a9a">not used</text><line x1="600" y1="1020" x2="552" y2="1020" class="free"/><text x="614" y="1026" class="v" text-anchor="start" style="fill:#9a9a9a">27</text><text x="538" y="1026" class="v" text-anchor="end" style="fill:#9a9a9a">not used</text><line x1="600" y1="1062" x2="552" y2="1062" class="free"/><text x=