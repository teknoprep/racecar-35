t-anchor="end">23</text><text x="1162" y="396" class="v" text-anchor="start">CAN1 RX  &lt;-  SN65HVD230 CRX   (optional)</text><line x1="1100" y1="432" x2="1148" y2="432" class="wire"/><circle cx="1148" cy="432" r="7" fill="#1b2420"/><text x="1086" y="438" class="v" text-anchor="end">22</text><text x="1162" y="438" class="v" text-anchor="start">CAN1 TX  -&gt;  SN65HVD230 CTX   (optional)</text><line x1="1100" y1="474" x2="1148" y2="474" class="free"/><text x="1086" y="480" class="v" text-anchor="end" style="fill:#9a9a9a">21</text><text x="1162" y="480" class="v" text-anchor="start" style="fill:#9a9a9a">not used  (A7 spare ADC)</text><line x1="1100" y1="516" x2="1148" y2="516" class="wire"/><circle cx="1148" cy="516" r="7" fill="#1b2420"/><text x="1086" y="522" class="v" text-anchor="end">20</text><text x="1162" y="522" class="v" text-anchor="start">A6  &lt;-  AEM 30-0300 via 20k/20k + 1 kΩ</text><line x1="1100" y1="558" x2="1148" y2="558" class="wire"/><circle cx="1148" cy="558" r="7" fill="#1b2420"/><text x="1086" y="564" class="v" text-anchor="end">19</text><text x="1162" y="564" class="v" text-anchor="start">SCL  -&gt;  IMU SCL</text><line x1="1100" y1="600" x2="1148" y2="600" class="wire"/><circle cx="1148" cy="600" r="7" fill="#1b2420"/><text x="1086" y="606" class="v" text-anchor="end">18</text><text x="1162" y="606" class="v" text-anchor="start">SDA  -&gt;  IMU SDA</text><line x1="1100" y1="642" x2="1148" y2="642" class="wire"/><circle cx="1148" cy="642" r="7" fill="#1b2420"/><text x="1086" y="648" class="v" text-anchor="end">17</text><text x="1162" y="648" class="v" text-anchor="start">A3  &lt;-  coolant sender + 150 Ω</text><line x1="1100" y1="684" x2="1148" y2="684" class="wire"/><circle cx="1148" cy="684" r="7" fill="#1b2420"/><text x="1086" y="690" class="v" text-anchor="end">16</text><text x="1162" y="690" class="v" text-anchor="start">A2  &lt;-  oil sender via 10 kΩ / 20 kΩ</text><line x1="1100" y1="726" x2="1148" y2="726" class="wire"/><circle cx="1148" cy="726" r="7" fill="#1b2420"/><text x="1086" y="732" class="v" text-anchor="end">15</text><text x="1162" y="732" class="v" text-anchor="start">RX3  &lt;-  CrowPanel J10 TXD0_H  (921600)</text><line x1="1100" y1="768" x2="1148" y2="768" class="wire"/><circle cx="1148" cy="768" r="7" fill="#1b2420"/><text x="1086" y="774" class="v" text-anchor="end">14</text><text x="1162" y="774" class="v" text-anchor="start">TX3  -&gt;  CrowPanel J10 RXD0_H  (921600)</text><line x1="1100" y1="810" x2="1148" y2="810" class="free"/><text x="1086" y="816" class="v" text-anchor="end" style="fill:#9a9a9a">13</text><text x="1162" y="816" class="v" text-anchor="start" style="fill:#9a9a9a">heartbeat LED — leave alone</text><line x1="1100" y1="852" x2="1148" y2="852" class="wire"/><circle cx="1148" cy="852" r="7" fill="#1b2420"/><text x="1086" y="858" class="v" text-anchor="end">GND</text><text x="1162" y="858" class="v" text-anchor="start">GND rail</text><line x1="1100" y1="894" x2="1148" y2="894" class="free"/><text x="1086" y="900" class="v" text-anchor="end" style="fill:#9a9a9a">41</text><text x="1162" y="900" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="936" x2="1148" y2="936" class="free"/><text x="1086" y="942" class="v" text-anchor="end" style="fill:#9a9a9a">40</text><text x="1162" y="942" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="978" x2="1148" y2="978" class="free"/><text x="1086" y="984" class="v" text-anchor="end" style="fill:#9a9a9a">39</text><text x="1162" y="984" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1020" x2="1148" y2="1020" class="free"/><text x="1086" y="1026" class="v" text-anchor="end" style="fill:#9a9a9a">38</text><text x="1162" y="1026" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1062" x2="1148" y2="1062" class="free"/><text x="1086" y="1068" class="v" text-anchor="end" style="fill:#9a9a9a">37</text><text x="1162" y="1068" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1104" x2="1148" y2="1104" class="free"/><text x="1086" y="1110" class="v" text-anchor="end" style="fill:#9a9a9a">36</text><text x="1162" y="1110" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1146" x2="1148" y2="1146" class="free"/><text x="1086" y="1152" class="v" text-anchor="end" style="fill:#9a9a9a">35</text><text x="1162" y="1152" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1188" x2="1148" y2="1188" class="free"/><text x="1086" y="1194" class="v" text-anchor="end" style="fill:#9a9a9a">34</text><text x="1162" y="1194" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><line x1="1100" y1="1230" x2="1148" y2="1230" class="free"/><text x="1086" y="1236" class="v" text-anchor="end" style="fill:#9a9a9a">33</text><text x="1162" y="1236" class="v" text-anchor="start" style="fill:#9a9a9a">not used</text><circle cx="56" cy="260" r="7" fill="#1b2420"/><text x="74" y="270" class="v">wired</text><circle cx="56" cy="290" r="6" fill="none" stroke="#9a9a9a" stroke-width="2"/><text x="74" y="296" class="v" style="fill:#9a9a9a">reserved</text><text x="48" y="326" class="v" style="fill:#9a9a9a">no dot = not used</text><rect x="48" y="1374" width="1604" height="250" rx="8" class="panel"/><text x="66" y="1408" class="h">Screw terminals — left edge of the board, top to bottom</text><text x="66" y="1440" class="v">J1 POWER   5V · GND                       &lt;- 5 V buck only, never 12 V</text><text x="66" y="1466" class="v">J2 SCREEN  GND · 5V · TX · RX              -&gt; CrowPanel J10 (XH2.54), 921600</text><text x="66" y="1492" class="v">J3 VIDEO   GND · TX · RX                   -&gt; Raspberry Pi 5 header 6/10/8, 3.3 V, 115200</text><text x="66" y="1518" class="v">J4 TACH    SIG · GND                       -&gt; PC817 input (R1 1 kΩ)</text><text x="66" y="1544" class="v">J5 OIL     5V · SIG · GND                  -&gt; 0.5-4.5 V transducer, divider at A2</text><text x="66" y="1570" class="v">J6 NTC     SIG · GND                       -&gt; coolant sender, 150 Ω pull-up at A3</text><text x="66" y="1596" class="v">J7 AEM     WHT · BRN                       -&gt; AEM 30-0300 pin 9 / pin 10, divider at A6</text><text x="66" y="1622" class="xs">Full pin-by-pin build sheet: ../breadboard/PINOUT.md  ·  tach front end: ../breadboard/OPTO_WIRING.svg</text></svg>