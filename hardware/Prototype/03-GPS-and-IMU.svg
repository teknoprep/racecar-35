<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1114" viewBox="0 0 1700 1114"><rect width="1700" height="1114" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">GPS and IMU — the two modules that sit on the board</text><text x="48" y="84" class="s" style="fill:#555">Both run on 3.3 V and both are read automatically at boot. Neither one needs a terminal block.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" fill="#f4d2c4" stroke="#a33" stroke-width="1.5"/><text x="62" y="130" class="xs">Feed the IMU 3.3 V, never 5 V — its pull-ups reference VCC and the Teensy is not 5 V tolerant.</text><text x="62" y="156" class="xs">Solder or crimp these four-wire connections properly: an intermittent jumper shows up as "IMU not found" or a frozen GPS.</text><rect x="48" y="224" width="790" height="560" rx="8" class="panel"/><text x="66" y="258" class="h">GPS — u-blox NEO-M9N</text><text x="66" y="282" class="xs" style="fill:#666">External active antenna on the SMA connector.</text><rect x="72" y="290" width="250" height="56" rx="8" class="chip"/><text x="197.0" y="324" class="s" text-anchor="middle">GPS module</text><rect x="564" y="290" width="250" height="56" rx="8" class="chip"/><text x="689.0" y="324" class="s" text-anchor="middle">Teensy 4.1 (Serial2)</text><text x="314" y="411" class="v" text-anchor="end">VCC / 3V3</text><text x="572" y="411" class="v" text-anchor="start">3.3 V</text><line x1="342" y1="404" x2="532.0" y2="404.0" class="wire"/><polygon points="544.0,404.0 529.0,410.0 529.0,398.0" fill="#1b2420"/><text x="443.0" y="430" class="xs" text-anchor="middle" style="fill:#666">SparkFun RTK boards accept 3.3-5 V; feed 3.3 V</text><text x="314" y="477" class="v" text-anchor="end">GND</text><text x="572" y="477" class="v" text-anchor="start">GND</text><line x1="342" y1="470" x2="544" y2="470" class="wire"/><text x="443.0" y="496" class="xs" text-anchor="middle" style="fill:#666">to the star rail, not the engine block</text><text x="314" y="543" class="v" text-anchor="end">TX</text><text x="572" y="543" class="v" text-anchor="start">pin 7  RX2</text><line x1="342" y1="536" x2="532.0" y2="536.0" class="wire"/><polygon points="544.0,536.0 529.0,542.0 529.0,530.0" fill="#1b2420"/><text x="443.0" y="562" class="xs" text-anchor="middle" style="fill:#666">module sends UBX/NMEA to the Teensy</text><text x="314" y="609" class="v" text-anchor="end">RX</text><text x="572" y="609" class="v" text-anchor="start">pin 8  TX2</text><line x1="544" y1="602" x2="354.0" y2="602.0" class="wire"/><polygon points="342.0,602.0 357.0,596.0 357.0,608.0" fill="#1b2420"/><text x="443.0" y="628" class="xs" text-anchor="middle" style="fill:#666">REQUIRED — boot config and baud change go here</text><text x="66" y="684" class="xs">Boot baud scan: 230400 -&gt; 38400 -&gt; 9600, then raised to 230400.</text><text x="66" y="710" class="xs" style="fill:#666">Keep these wires short and away from the tach/oil harness.</text><text x="66" y="740" class="xs" style="fill:#666">Settings -&gt; GPS baud can change it live; a bad pick is rescanned.</text><rect x="862" y="224" width="790" height="560" rx="8" class="panel"/><text x="880" y="258" class="h">IMU — MPU-6050 on a GY-521 board</text><text x="880" y="282" class="xs" style="fill:#666">XDA / XCL / INT stay unconnected.</text><rect x="886" y="290" width="250" height="56" rx="8" class="chip"/><text x="1011.0" y="324" class="s" text-anchor="middle">GY-521</text><rect x="1378" y="290" width="250" height="56" rx="8" class="chip"/><text x="1503.0" y="324" class="s" text-anchor="middle">Teensy 4.1 (Wire)</text><text x="1128" y="411" class="v" text-anchor="end">VCC</text><text x="1386" y="411" class="v" text-anchor="start">3.3 V</text><line x1="1156" y1="404" x2="1346.0" y2="404.0" class="wire"/><polygon points="1358.0,404.0 1343.0,410.0 1343.0,398.0" fill="#1b2420"/><text x="1257.0" y="430" class="xs" text-anchor="middle" style="fill:#666">NOT 5 V</text><text x="1128" y="477" class="v" text-anchor="end">GND</text><text x="1386" y="477" class="v" text-anchor="start">GND</text><line x1="1156" y1="470" x2="1358" y2="470" class="wire"/><text x="1257.0" y="496" class="xs" text-anchor="middle" style="fill:#666">shared star ground</text><text x="1128" y="543" class="v" text-anchor="end">SDA</text><text x="1386" y="543" class="v" text-anchor="start">pin 18  SDA</text><line x1="1358" y1="536" x2="1168.0" y2="536.0" class="wire"/><polygon points="1156.0,536.0 1171.0,530.0 1171.0,542.0" fill="#1b2420"/><text x="1257.0" y="562" class="xs" text-anchor="middle" style="fill:#666">I2C0 — not 16/17, not 24/25</text><text x="1128" y="609" class="v" text-anchor="end">SCL</text><text x="1386" y="609" class="v" text-anchor="start">pin 19  SCL</text><line x1="1358" y1="602" x2="1168.0" y2="602.0" class="wire"/><polygon points="1156.0,602.0 1171.0,596.0 1171.0,608.0" fill="#1b2420"/><text x="1257.0" y="628" class="xs" text-anchor="middle" style="fill:#666">400 kHz, address 0x68</text><text x="1128" y="675" class="v" text-anchor="end">AD0</text><text x="1386" y="675" class="v" text-anchor="start">GND</text><line x1="1156" y1="668" x2="1358" y2="668" class="wire"/><text x="1257.0" y="694" class="xs" text-anchor="middle" style="fill:#666">AD0 high or floating -&gt; 0x69 -&gt; "not found"</text><text x="880" y="724" class="xs">Detection is one-shot at boot: all-zero IMU lines mean it never ACKed,</text><text x="880" y="748" class="xs" style="fill:#666">not a calibration problem. Re-seat the header and reboot.</text><rect x="48" y="824" width="790" height="250" rx="8" class="panel"/><text x="66" y="858" class="h">What the boot banner should say</text><text x="66" y="890" class="v">MPU-6050 ready</text><text x="66" y="916" class="v">IMU cal: gyro bias removed, accel scaled to 1.00 g</text><text x="66" y="942" class="v">FreqMeasureMulti on pin 9: armed   (tach front end)</text><text x="66" y="968" class="v">CAN1 ready at 500000 bps   (only if the transceiver is fitted)</text><text x="66" y="994" class="xs">Boot the car stationary or the IMU auto-cal is rejected and the last good</text><text x="66" y="1020" class="xs">calibration in EEPROM is kept instead.</text><rect x="862" y="824" width="790" height="250" rx="8" class="panel"/><text x="880" y="858" class="h">Mounting the IMU</text><text x="880" y="890" class="v">Board flat, component side up, header pins toward the rear of the car.</text><text x="880" y="916" class="v">  +X = forward      (accelerate / brake)</text><text x="880" y="942" class="v">  +Y = right        (right-hand turns read negative)</text><text x="880" y="968" class="v">  +Z = up           (about -1.0 g sitting level)</text><text x="880" y="994" class="xs">Get this wrong and the lateral / longitudinal g in your logs will be swapped</text><text x="880" y="1020" class="xs">or mirrored, which is hard to spot afterwards.</text></svg>