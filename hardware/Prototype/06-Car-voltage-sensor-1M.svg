<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1852" viewBox="0 0 1700 1852"><rect width="1700" height="1852" fill="#f3efe6"/><style>
 text{font-family:DejaVu Sans,Liberation Sans,sans-serif;fill:#1b2420}
 .t{font-size:34px;font-weight:700}
 .h{font-size:24px;font-weight:700}
 .s{font-size:18px}
 .v{font-family:DejaVu Sans Mono,monospace;font-size:16px}
 .xs{font-size:15px}
 .pin{font-family:DejaVu Sans Mono,monospace;font-size:19px;font-weight:700;fill:#a33}
 .box{fill:#f7f4ee;stroke:#1b2420;stroke-width:2.5}
 .wire{stroke:#1b2420;stroke-width:3;fill:none}
 .comp{fill:none;stroke:#1b2420;stroke-width:3}
 .panel{fill:#ffffff;stroke:#1b2420;stroke-width:2}
 .chip{fill:#eef3f7;stroke:#1b2420;stroke-width:2.5}
 .term{fill:#222222;stroke:#c9a227;stroke-width:2}
 .free{stroke:#b4b4b4;stroke-width:2;fill:none}
 .dim{fill:#9a9a9a}
</style><text x="48" y="52" class="t">Car voltage sensor — the 1 MΩ build (1 MΩ + 100 kΩ + 10 kΩ)</text><text x="48" y="84" class="s" style="fill:#555">Same 10:1 divider, built from what is in the drawer. 1.11 MΩ / 110 kΩ = 10.09:1, so it reads 0.9 % low — leave the firmware alone.</text><rect x="48" y="100" width="1604" height="78" rx="6" class="box" style="fill:#f4d2c4;stroke:#a33;stroke-width:1.5"/><text x="62" y="130" class="xs">NEVER connect 12 V (or any wire from the car) straight to a Teensy pin. The 1 MΩ limits fault current to ~100 µA even at 100 V, but the divider is still mandatory.</text><text x="62" y="156" class="xs">Needs firmware v0.1.172 or newer, then Settings → Sensor monitoring → VOLT → Source = DIRECT. Until then the Teensy does not read pin 40 at all.</text><text x="48" y="224" class="h">1. Solder exactly this — your values, same 1:10 ratio</text><rect x="70" y="402" width="200" height="64" rx="8" class="term"/><text x="170.0" y="432" class="s" text-anchor="middle" style="fill:#f5e6a8">J8  V+</text><text x="170.0" y="452" class="xs" text-anchor="middle" style="fill:#dddddd">fused car +12 V</text><rect x="70" y="742" width="200" height="64" rx="8" class="term"/><text x="170.0" y="772" class="s" text-anchor="middle" style="fill:#f5e6a8">J8  GND</text><text x="170.0" y="792" class="xs" text-anchor="middle" style="fill:#dddddd">car ground</text><text x="170" y="364" class="xs" text-anchor="middle" style="fill:#666">same fused feed as the</text><text x="170" y="384" class="xs" text-anchor="middle" style="fill:#666">5 V buck input (after the fuse)</text><line x1="270" y1="434" x2="340" y2="434" class="wire"/><polyline points="340.0,434.0 354.2,448.0 382.5,420.0 410.8,448.0 439.2,420.0 467.5,448.0 495.8,420.0 510.0,434.0" class="comp"/><text x="425" y="404" class="s" text-anchor="middle">R1  1 MΩ</text><text x="425" y="356" class="xs" text-anchor="middle" style="fill:#666">sets the ratio AND limits fault</text><text x="425" y="376" class="xs" text-anchor="middle" style="fill:#666">current (100 V → ~100 µA)</text><line x1="510" y1="434" x2="760" y2="434" class="wire"/><circle cx="640" cy="434" r="9" fill="#1b2420"/><text x="626" y="418" class="pin" text-anchor="end">A</text><polyline points="760.0,434.0 769.2,448.0 787.5,420.0 805.8,448.0 824.2,420.0 842.5,448.0 860.8,420.0 870.0,434.0" class="comp"/><text x="815" y="404" class="s" text-anchor="middle">R3  1 kΩ</text><line x1="870" y1="434" x2="1150" y2="434" class="wire"/><circle cx="930" cy="434" r="8" fill="#1b2420"/><text x="944" y="418" class="pin">B</text><rect x="1150" y="404" width="300" height="60" rx="8" class="chip"/><text x="1300" y="430" class="s" text-anchor="middle">Teensy 4.1  pin 40</text><text x="1300" y="452" class="xs" text-anchor="middle" style="fill:#666">A16  (ADC1)</text><line x1="640" y1="434" x2="640" y2="374" class="wire"/><polygon points="620,374 660,374 640,330" fill="#f7f4ee" stroke="#1b2420" stroke-width="2.5"/><line x1="620" y1="330" x2="660" y2="330" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="620" y1="330" x2="620" y2="337" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="620" y1="337" x2="614" y2="337" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="660" y1="330" x2="660" y2="323" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="660" y1="323" x2="666" y2="323" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="640" y1="330" x2="640" y2="284" class="wire"/><circle cx="640" cy="284" r="7" fill="#1b2420"/><text x="656" y="290" class="v">3.3 V  (Teensy 3.3V pin / rail)</text><text x="680" y="342" class="xs">D1  1N4001 (or any small diode)</text><text x="680" y="362" class="xs" style="fill:#a33">band (K) UP toward 3.3 V</text><line x1="640" y1="434" x2="640" y2="494" class="wire"/><polyline points="640.0,494.0 654.0,503.2 626.0,521.5 654.0,539.8 626.0,558.2 654.0,576.5 626.0,594.8 640.0,604.0" class="comp"/><text x="666" y="534" class="s">R2  100 kΩ</text><line x1="640" y1="604" x2="640" y2="634" class="wire"/><polyline points="640.0,634.0 654.0,640.7 626.0,654.0 654.0,667.3 626.0,680.7 654.0,694.0 626.0,707.3 640.0,714.0" class="comp"/><text x="666" y="674" class="s">R4  10 kΩ</text><line x1="640" y1="714" x2="640" y2="774" class="wire"/><circle cx="640" cy="774" r="7" fill="#1b2420"/><text x="666" y="706" class="xs" style="fill:#666">bottom leg = 100 k + 10 k = 110 kΩ</text><line x1="640" y1="464" x2="520" y2="464" class="wire"/><circle cx="640" cy="464" r="7" fill="#1b2420"/><line x1="520" y1="464" x2="520" y2="584" class="wire"/><polygon points="500,628 540,628 520,584" fill="#f7f4ee" stroke="#1b2420" stroke-width="2.5"/><line x1="500" y1="584" x2="540" y2="584" class="wire" style="stroke:#1b2420;stroke-width:3.5"/><line x1="500" y1="584" x2="500" y2="591" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="500" y1="591" x2="494" y2="591" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="540" y1="584" x2="540" y2="577" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="540" y1="577" x2="546" y2="577" class="wire" style="stroke:#1b2420;stroke-width:3"/><line x1="520" y1="628" x2="520" y2="774" class="wire"/><circle cx="520" cy="774" r="7" fill="#1b2420"/><text x="490" y="602" class="xs" text-anchor="end">D2  1N4001</text><text x="490" y="622" class="xs" text-anchor="end" style="fill:#a33">band (K) UP toward A</text><text x="490" y="642" class="xs" text-anchor="end" style="fill:#666">catches reverse / negative spikes</text><line x1="930" y1="434" x2="930" y2="614" class="wire"/><line x1="907.0" y1="614" x2="953.0" y2="614" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="907.0" y1="628" x2="953.0" y2="628" class="wire" style="stroke:#1b2420;stroke-width:4"/><line x1="930" y1="628" x2="930" y2="774" class="wire"/><circle cx="930" cy="774" r="7" fill="#1b2420"/><text x="966" y="616" class="s">C1  100 nF ceramic</text><text x="966" y="638" class="xs" style="fill:#a33">AT pin 40 — now load-bearing:</text><text x="966" y="658" class="xs" style="fill:#666">the divider is ~99 kΩ here</text><line x1="270" y1="774" x2="340" y2="774" class="wire" style="stroke:#0a6;stroke-width:8"/><line x1="270" y1="774" x2="1450" y2="774" class="wire" style="stroke:#0a6;stroke-width:8"/><text x="290" y="810" class="s">GND rail — the star point, shared with J1 GND and the Teensy GND pins</text><rect x="1280" y="504" width="320" height="226" rx="8" class="box" style="fill:#ffffff;stroke:#1b2420;stroke-width:2"/><text x="1300" y="534" class="v">J8 V+   node A     dash</text><line x1="1294" y1="544" x2="1586" y2="544" class="wire" style="stroke:#999;stroke-width:1.5"/><text x="1300" y="572" class="v">12.00   1.189 V    11.9 V</text><text x="1300" y="598" class="v">14.40   1.427 V    14.3 V</text><text x="1300" y="624" class="v">16.00   1.586 V    15.9 V</text><text x="1300" y="650" class="v" style="fill:#a33">33.0    3.270 V    (ADC max)</text><text x="1300" y="696" class="xs" style="fill:#666">reads 0.9 % low: 10.09:1, not 10:1</text><text x="1300" y="716" class="xs" style="fill:#666">— smaller than the 1 MΩ's own tolerance</text><text x="48" y="864" class="h">2. Which way round the diodes go — the BAND is the cathode (K)</text><line x1="220" y1="954" x2="280" y2="954" class="wire"/><line x1="380" y1="954" x2="440" y2="954" class="wire"/><rect x="280" y="936" width="100" height="36" rx="10" class="box" style="fill:#e8d7b0;stroke:#1b2420;stroke-width:2.5"/><rect x="356" y="936" width="16" height="36" rx="2" class="box" style="fill:#1b2420;stroke:#1b2420;stroke-width:1"/><text x="212" y="960" class="pin" text-anchor="end">A</text><text x="448" y="960" class="pin">K</text><text x="330" y="924" class="xs" text-anchor="middle">D1:  A = node A   ·   K (band) = 3.3 V rail</text><text x="330" y="998" class="xs" text-anchor="middle" style="fill:#666">conducts only if A rises above about 3.9 V</text><line x1="890" y1="954" x2="950" y2="954" class="wire"/><line x1="1050" y1="954" x2="1110" y2="954" class="wire"/><rect x="950" y="936" width="100" height="36" rx="10" class="box" style="fill:#e8d7b0;stroke:#1b2420;stroke-width:2.5"/><rect x="1026" y="936" width="16" height="36" rx="2" class="box" style="fill:#1b2420;stroke:#1b2420;stroke-width:1"/><text x="882" y="960" class="pin" text-anchor="end">A</text><text x="1118" y="960" class="pin">K</text><text x="1000" y="924" class="xs" text-anchor="middle">D2:  A = GND rail   ·   K (band) = node A</text><text x="1000" y="998" class="xs" text-anchor="middle" style="fill:#666">conducts only if A goes below about −0.6 V</text><text x="1370" y="940" class="xs">1N4001, 1N4148, BAT85 …</text><text x="1370" y="962" class="xs">anything you have — the</text><text x="1370" y="984" class="xs">clamps see ~100 µA at 100 V.</text><rect x="48" y="1034" width="1604" height="176" rx="8" class="box" style="fill:#fffbe8;stroke:#c9a227;stroke-width:2"/><text x="70" y="1066" class="h">3. Bench check — BEFORE the car or the dash setting</text><text x="70" y="1096" class="v">1)  Power OFF, ohmmeter: J8 V+ to J8 GND ≈ 1.11 MΩ.   J8 V+ must NOT read 0 Ω to 3.3 V or 5 V.   Node A to GND = 110 kΩ.</text><text x="70" y="1122" class="v">2)  Teensy powered, 12.00 V on J8:  node A should read 1.189 V.</text><text x="70" y="1148" class="v" style="fill:#a33">3)  ⚠  YOUR METER LOADS THIS NODE.  A 1 MΩ-input DMM pulls it ~9 % low (10 MΩ ~1 %): 1.08 V instead of 1.19 V is</text><text x="70" y="1170" class="v" style="fill:#a33">     the meter, not the divider. Once enabled, trust the Teensy's own VOLT row — it draws essentially nothing.</text><text x="70" y="1196" class="v">4)  J8 open / powered off:  node A reads 0 V.   Anything near 3.3 V = bottom leg missing or R1/R2 swapped — STOP.</text><rect x="48" y="1230" width="1604" height="300" rx="8" class="box" style="fill:#ffffff;stroke:#1b2420;stroke-width:2"/><text x="66" y="1262" class="h">4. Solder order — divider first, protection second, Teensy wire last</text><text x="66" y="1296" class="v">1.  J8 V+  →  R1 1 MΩ  →  a free row = node A.</text><text x="66" y="1325" class="v">2.  R2 100 kΩ from A  →  next row, then R4 10 kΩ from there  →  GND rail.   (bottom leg = 110 kΩ)</text><text x="66" y="1354" class="v">3.  D1: plain end on A, BAND to the 3.3 V rail.     D2: plain end on the GND rail, BAND on A.</text><text x="66" y="1383" class="v">4.  R3 1 kΩ from A  →  node B.     C1 100 nF from B  →  GND rail, as close to pin 40 as you can get it.</text><text x="66" y="1412" class="v">5.  J8 GND  →  GND rail.     Then bench check step 2 with a 12 V supply on J8.</text><text x="66" y="1441" class="v">6.  LAST: node B  →  Teensy pin 40 (A16).     Pin 40 is on the long edge, between 39 and 41.</text><text x="66" y="1470" class="v">7.  Dash: Settings → Sensor monitoring → tap VOLT → Source = DIRECT → BACK → DONE.</text><text x="66" y="1499" class="v">     The Teensy only reads / logs pin 40 after that (CFG,vdir,1). Leave it off until the divider exists.</text><rect x="48" y="1550" width="792" height="262" rx="8" class="panel"/><text x="66" y="1584" class="h">Why 1 MΩ is fine here</text><text x="66" y="1616" class="xs">Only the RATIO matters: 1.11 MΩ / 110 kΩ = 10.09, which is the same 1:10</text><text x="66" y="1642" class="xs">the firmware expects — it reads 0.13 V low at 14.4 V, well inside the 1 MΩ's</text><text x="66" y="1668" class="xs">own tolerance if that part is 5 %.</text><text x="66" y="1694" class="xs">Full scale is still 33 V, so charging voltage and jump-start spikes keep the</text><text x="66" y="1720" class="xs">same headroom as the 180 kΩ / 20 kΩ build.</text><text x="66" y="1746" class="xs">The divider draws ~11 µA instead of ~70 µA, and the clamps are even gentler.</text><text x="66" y="1772" class="xs">What to watch: the 100 nF at pin 40 (see C1) and the meter loading above.</text><rect x="864" y="1550" width="788" height="262" rx="8" class="panel"/><text x="882" y="1584" class="h">Parts — everything for this build</text><text x="882" y="1616" class="v">R1   1 MΩ      (the top leg)</text><text x="882" y="1642" class="v">R2  100 kΩ      R4  10 kΩ      (bottom leg, in series = 110 kΩ)</text><text x="882" y="1668" class="v">R3    1 kΩ      C1  100 nF ceramic, at pin 40</text><text x="882" y="1694" class="v">D1, D2  1N4001 (or 1N4148 / BAT85)</text><text x="882" y="1720" class="v">J8  2-position 5.08 mm screw terminal</text><text x="882" y="1746" class="xs">If your 1 MΩ meters more than ~2 % off, tell me the measured value and I</text><text x="882" y="1772" class="xs">will set VIN_DIVIDER_RATIO to it so the dash reads exact instead of 0.9 % low.</text></svg>