; Minimal boot smoke test for the CrowPanel ESP32-S3 7" V3.0.
;
; PSRAM intentionally DISABLED — earlier flashes showed the chip boot-
; looping with rst:0x3 (RTC_SW_SYS_RST) and never reaching app code.
; We strip PSRAM out to prove basic boot, then layer it back.

[env:crowpanel_baseline]
platform = espressif32@^6.7.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Try Quad-SPI PSRAM (not Octal). Spec said 8 MB but vendor specs are
; unreliable; if the module is actually 2 MB Quad, OPI init crashes.
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.memory_type = qio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
