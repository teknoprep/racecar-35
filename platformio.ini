; PlatformIO Project Configuration File
; racecar-35 dash firmware

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; Pin the monitor to the Teensy's USB-CDC port so it doesn't accidentally
; grab the CrowPanel's CH340 when both are plugged in.
;   Windows: COM4 (Teensy) vs COM3 (CrowPanel)
;   Linux:   /dev/ttyACM0 (Teensy) vs /dev/ttyUSB0 (CrowPanel)
; Pick the right one for your host — override on the CLI with --port if needed.
monitor_port = /dev/ttyACM0

; Upload: teensy-cli (teensy_loader_cli) works on Linux and is what PlatformIO
; installs by default. On Windows use upload_protocol = teensy-gui because
; teensy_loader_cli isn't shipped there.
upload_protocol = teensy-cli

; (v0.1.99 shipped with build_unflags=-O2 / build_flags=-Os as a one-off OTA
; rescue: the old FlasherX squeezed the staging buffer below the -O2 image
; size. The FLASH_RESERVE fix in lib/FlasherX/FlashTxx.h is deployed as of
; 0.1.99, so builds are back on the default -O2 with a ~7.5 MB buffer.)

lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library
    arduino-libraries/Ethernet
