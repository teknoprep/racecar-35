; PlatformIO Project Configuration File
; racecar-35 dash firmware

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; Force PIO's monitor onto the Teensy's USB-CDC port. Without this, when the
; CrowPanel is also plugged in, monitor auto-picks COM3 (the CrowPanel's
; CH340) and you see the wrong device's output. The Teensy enumerates as
; "USB Serial Device" — usually COM4 here. Override on the CLI with
;   pio device monitor --port COMx
; if it ever changes.
monitor_port = COM4

; Use the bundled Teensy Loader GUI (teensy.exe) — PlatformIO does not
; ship teensy_loader_cli.exe on Windows, so `teensy-cli` fails with
; "'teensy_loader_cli' is not recognized". `teensy-gui` is also the
; PlatformIO default for this board.
upload_protocol = teensy-gui

lib_deps =
    sparkfun/SparkFun u-blox GNSS Arduino Library
    arduino-libraries/Ethernet
